name: Appirio
description: 'Appirio is a global cloud services and consulting company founded in 2006 and headquartered
  in Indianapolis, acquired by Wipro for USD 500 million in 2016 and now operating as "Appirio, a Wipro
  company." Appirio is a strategic implementation partner for Salesforce, Workday, Google, and Amazon,
  helping over 3,000 enterprises across healthcare and life sciences, banking, higher education, manufacturing,
  and retail adopt cloud-based solutions. Its services span Salesforce ecosystem consulting, CRM and platform
  implementation, cloud application development, and digital transformation. Appirio is a consulting and
  systems-integration firm rather than an API producer: it does not publish a public developer program,
  OpenAPI definitions, SDKs, or a developer portal, so this profile carries company identity only and no
  API artifacts.'
